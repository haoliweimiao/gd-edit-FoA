<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gd-edit 存档查看器</title>
<style>
  :root {
    --bg: #171a1f;
    --panel: #20242b;
    --panel-2: #272c35;
    --text: #d7dde6;
    --muted: #8b94a3;
    --accent: #4f9cf9;
    --border: #343b46;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  #list-pane {
    width: 260px; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border); padding: 10px;
  }
  #list-pane h2 { font-size: 13px; color: var(--muted); margin: 10px 8px 8px; }
  #list-pane h2:first-child { margin-top: 2px; }
  .char {
    display: block; width: 100%; text-align: left;
    padding: 10px 12px; margin-bottom: 6px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 14px;
  }
  .char:hover { border-color: var(--accent); }
  .char.active { border-color: var(--accent); background: #26313f; }
  #detail-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #detail-empty { color: var(--muted); margin-top: 40px; text-align: center; padding: 20px 26px 0; }
  #detail { display: none; overflow-y: auto; padding: 20px 26px; }
  .char-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  table { border-collapse: collapse; width: 100%; max-width: 520px; }
  td {
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  td:first-child { color: var(--muted); width: 40%; }
  td:last-child { font-variant-numeric: tabular-nums; }
  #error {
    display: none; position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--danger); color: #fff; padding: 10px 18px;
    border-radius: 6px; font-size: 13px; z-index: 10;
  }
  #toast {
    display: none; position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    background: #2f9e44; color: #fff; padding: 10px 18px;
    border-radius: 6px; font-size: 13px; z-index: 10;
  }
  input[type=number] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 8px; font-size: 14px; width: 150px;
  }
  .small-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 10px; margin-left: 6px; cursor: pointer; font-size: 13px;
  }
  .small-btn:hover { border-color: var(--accent); }
  .small-btn.primary { border-color: var(--accent); color: #cfe4ff; }
  .small-btn.danger { border-color: var(--danger); color: #e58a8d; }
  .small-btn.danger:hover { background: var(--danger); color: #fff; }
  .small-btn:disabled { opacity: 0.5; cursor: default; }
  .qty-editor { display: flex; align-items: center; gap: 4px; margin-left: 6px; }
  .qty-editor input[type=number] { width: 64px; padding: 5px 6px; }

  /* ---- 公共仓库 ---- */
  #stash-view { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; padding: 20px 26px; max-width: 1100px; }
  #stash-toolbar { flex: none; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin-bottom: 12px; }
  #stash-tabs { flex: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  #stash-body { flex: 1; display: flex; min-height: 0; gap: 14px; }
  #stash-grid-wrap { flex: 1; overflow: auto; }
  #item-detail {
    flex: none; width: 380px; max-width: 46vw; display: none;
    border-left: 1px solid var(--border); background: var(--panel);
    border-radius: 6px; padding: 14px; overflow-y: auto;
  }
  #item-detail.open { display: block; }
  #item-detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  #item-detail-name { font-size: 15px; font-weight: 600; word-break: break-word; }
  #item-detail-sub { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.5; }
  #idetail-lines { font-size: 13px; line-height: 1.55; }
  #idetail-lines .line.empty { height: 8px; }
  #idetail-lines .y { color: #e6c14f; }
  #idetail-lines .r { color: var(--danger); }
  #idetail-lines .g { color: #6ec28a; }
  #idetail-lines .b { font-weight: 600; }
  .stash-item.selected { outline: 2px solid var(--accent); z-index: 3; }
  .catalog-list tbody tr.selected { background: rgba(79,156,249,0.16); }
  #stash-settings { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13px; color: var(--muted); }
  #stash-settings label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  #stash-settings input[type=checkbox] { accent-color: var(--accent); }
  #stash-settings input[type=number] { width: 62px; padding: 3px 6px; font-size: 13px; }
  #stash-settings .small-btn { padding: 3px 9px; margin-left: 0; }
  #stash-modes select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 13px; margin-left: 6px;
  }
  .tab-btn {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--accent); }
  .tab-btn.active { color: #cfe4ff; border-color: var(--accent); background: #26313f; }
  #stash-grid {
    position: relative;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: var(--cell, 38px) var(--cell, 38px);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .stash-item {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    background: rgba(42,51,63,0.95);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 3px;
    font-size: 11px; line-height: 1.2;
    cursor: default;
  }
  .stash-item:hover { outline: 1px solid #fff; z-index: 2; }
  .stash-item .st-name {
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0;
  }
  .stash-item .st-count {
    position: absolute; right: 2px; bottom: 1px;
    font-size: 10px; color: #ffe08a;
  }
  .stash-item .st-rarity {
    position: absolute; left: 2px; top: 1px;
    font-size: 8px; opacity: 0.85; letter-spacing: 0.5px;
  }
  .stash-item .st-level {
    position: absolute; right: 2px; top: 1px;
    font-size: 8px; color: #8fd3ff; opacity: 0.9;
  }
  #stash-empty { color: var(--muted); text-align: center; margin-top: 30px; }
  .catalog-list { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .catalog-list th {
    text-align: left; padding: 5px 10px; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap;
  }
  .catalog-list td {
    padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
    vertical-align: middle;
  }
  .catalog-list tbody tr:hover { background: rgba(255,255,255,0.05); }
  .catalog-list .cat-count { color: var(--accent); white-space: nowrap; text-align: right; }
  .catalog-list .cat-path {
    color: var(--muted); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 420px;
  }

  /* ---- 物品选择器 ---- */
  #picker-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  #picker {
    width: 620px; max-width: 92vw; height: 70vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .picker-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .picker-title { font-size: 15px; font-weight: 600; }
  .picker-pos { color: var(--muted); font-size: 13px; }
  .picker-head .small-btn { margin-left: auto; }
  .picker-search {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .picker-search input {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 9px; font-size: 13px;
  }
  .picker-total { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #picker-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .picker-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
    border-left: 3px solid transparent;
  }
  .picker-row:hover { background: rgba(255,255,255,0.05); }
  .picker-row.selected { background: rgba(79,156,249,0.16); border-left-color: var(--accent); }
  .picker-row.disabled { opacity: 0.45; cursor: default; }
  .picker-row .pk-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-row .pk-rarity { width: 56px; font-size: 11px; }
  .picker-row .pk-level { width: 42px; flex: none; text-align: right; color: var(--muted); font-size: 11px; }
  .picker-row .pk-dims { width: 60px; flex: none; text-align: right; color: var(--muted); font-size: 11px; }
  .picker-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-top: 1px solid var(--border);
  }
  .picker-count { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .picker-count input { width: 68px; }
  .picker-page { color: var(--muted); font-size: 12px; }
  .picker-foot #picker-add { margin-left: auto; }

  /* ---- 备份管理 ---- */
  #backup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  #backup {
    width: 640px; max-width: 92vw; height: 68vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #backup-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .bk-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px; font-size: 13px;
  }
  .bk-row:hover { background: rgba(255,255,255,0.05); }
  .bk-row input { accent-color: var(--accent); margin: 0; }
  .bk-file { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
  .bk-size { width: 72px; flex: none; text-align: right; color: var(--muted); font-size: 11px; }
  .bk-time { width: 150px; flex: none; text-align: right; color: var(--muted); font-size: 11px; }
  .bk-empty { color: var(--muted); padding: 26px; text-align: center; font-size: 13px; }
  #backup-delete { margin-left: auto; }

  /* ---- 词缀修改 ---- */
  #affix-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  #affix {
    width: 620px; max-width: 92vw; height: 68vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #affix-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .ax-cur { color: var(--muted); font-size: 10px; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
  .picker-row.selected .ax-cur { color: #cfe4ff; border-color: var(--accent); }
  .ax-level { width: 46px; flex: none; text-align: right; color: var(--muted); font-size: 11px; }
  .ax-attrs { flex: 1 1 100%; width: 100%; padding: 2px 2px 0 0; }
  .ax-attrs .line { font-size: 11px; line-height: 1.5; color: #cfe4ff; }
  .ax-attrs .line.empty { height: 0; }

  /* ---- 技能/专精（只读） ---- */
  #skills-view { margin-top: 18px; }
  #skills-view h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: var(--text); }
  #skills-view .skills-points { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #skills-view details { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); }
  #skills-view summary { cursor: pointer; padding: 9px 12px; font-size: 13px; font-weight: 600; color: #cfe4ff; user-select: none; }
  #skills-view summary:hover { background: rgba(255,255,255,0.05); }
  #skills-view .inv { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 8px; }
  #skills-view .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 14px; padding: 6px 12px 12px; }
  #skills-view .sk { display: flex; align-items: baseline; font-size: 12px; line-height: 1.6; }
  #skills-view .sk-tier { flex: none; width: 20px; height: 20px; line-height: 20px; margin-right: 8px; border-radius: 4px;
    text-align: center; font-size: 11px; font-weight: 600; color: #0f1216; background: linear-gradient(180deg,#e6e8ec,#b9c2cc); }
  #skills-view .sk-name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #skills-view .sk-lv { flex: none; color: var(--muted); font-size: 11px; margin-left: 8px; white-space: nowrap; }
  #skills-view .sk-lv b { color: #ffd27a; }
</style>
</head>
<body>
<header>
  <h1>gd-edit 存档查看器</h1>
  <span id="status">加载中…</span>
</header>
<main>
  <div id="list-pane">
    <h2>公共仓库</h2>
    <button id="stash-btn" class="char">公共仓库</button>
    <h2>角色列表</h2>
    <div id="char-list"></div>
  </div>
  <div id="detail-pane">
    <div id="detail-empty">请在左侧选择一个角色或「公共仓库」</div>
    <div id="detail" style="display:none">
      <div class="char-title" id="char-name"></div>
      <button class="small-btn primary" id="inv-btn" style="margin-bottom:14px">查看背包</button>
      <button class="small-btn" id="backup-btn" style="margin-bottom:14px">备份</button>
      <table id="attr-table"></table>
      <div id="skills-view"></div>
    </div>
    <div id="stash-view" style="display:none">
      <div class="char-title">共享仓库</div>
      <div id="stash-toolbar">
        <div id="stash-modes">
          <label>模式:
            <select id="stash-mode">
              <option value="standard">普通</option>
              <option value="hardcore">专家</option>
            </select>
          </label>
        </div>
        <div id="stash-settings">
          <label>语言
            <select id="stash-lang">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <label><input type="checkbox" id="opt-name" checked> 名称</label>
          <label><input type="checkbox" id="opt-stack" checked> 叠堆数</label>
          <label><input type="checkbox" id="opt-empty" checked> 空格底色</label>
          <label><input type="checkbox" id="opt-rarity" checked> 稀有度着色</label>
          <label><input type="checkbox" id="opt-rarity-text" checked> 稀有度文字</label>
          <label>格子
            <button class="small-btn" id="cell-dec">−</button>
            <input type="number" id="cell-input" min="24" max="64" step="2" value="38">
            <button class="small-btn" id="cell-inc">＋</button>
          </label>
        </div>
      </div>
      <div id="stash-tabs"></div>
      <div id="stash-body">
        <div id="stash-grid-wrap">
          <div id="stash-grid"></div>
        </div>
        <div id="item-detail"></div>
      </div>
    </div>
  </div>
</main>
<div id="error"></div>
<div id="toast"></div>
<div id="picker-overlay" style="display:none">
  <div id="picker">
    <div class="picker-head">
      <span class="picker-title">选择物品</span>
      <span class="picker-pos" id="picker-pos"></span>
      <button class="small-btn" id="picker-close">✕</button>
    </div>
    <div class="picker-search">
      <input type="text" id="picker-q" placeholder="搜索物品名称或路径…" autocomplete="off">
      <span class="picker-total" id="picker-total"></span>
    </div>
    <div id="picker-list"></div>
    <div class="picker-foot">
      <label class="picker-count">数量 <input type="number" id="picker-count" min="1" max="9999" step="1" value="1"></label>
      <button class="small-btn" id="picker-prev">上一页</button>
      <span class="picker-page" id="picker-page"></span>
      <button class="small-btn" id="picker-next">下一页</button>
      <button class="small-btn primary" id="picker-add">新增</button>
    </div>
  </div>
</div>
<div id="backup-overlay" style="display:none">
  <div id="backup">
    <div class="picker-head">
      <span class="picker-title">备份管理</span>
      <span class="picker-pos" id="backup-sub"></span>
      <button class="small-btn" id="backup-close">✕</button>
    </div>
    <div id="backup-list"></div>
    <div class="picker-foot">
      <button class="small-btn" id="backup-selectall">全选</button>
      <span class="picker-pos">每次写档自动生成 .bak 备份，确认无误后可清理</span>
      <button class="small-btn danger" id="backup-delete">删除选中 (0)</button>
    </div>
  </div>
</div>
<div id="affix-overlay" style="display:none">
  <div id="affix">
    <div class="picker-head">
      <span class="picker-title" id="affix-title">修改词缀</span>
      <span class="picker-pos" id="affix-sub"></span>
      <button class="small-btn" id="affix-close">✕</button>
    </div>
    <div class="picker-search">
      <input type="text" id="affix-q" placeholder="搜索词缀名称或路径…" autocomplete="off">
      <span class="picker-total" id="affix-total"></span>
    </div>
    <div id="affix-list"></div>
    <div class="picker-foot">
      <span class="picker-pos">选择词缀后点「应用」，写入前自动备份；选「（无）清除词缀」可去掉当前词缀</span>
      <button class="small-btn primary" id="affix-apply">应用</button>
    </div>
  </div>
</div>
<script>
"use strict";

function $(id) { return document.getElementById(id); }

function showError(msg) {
  var el = $("error");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function () { el.style.display = "none"; }, 4000);
}

function showToast(msg) {
  var el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function () { el.style.display = "none"; }, 5000);
}

/* ---------- 角色列表 ---------- */
function loadCharacters() {
  fetch("/api/characters")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      var list = data.characters || [];
      var box = $("char-list");
      box.innerHTML = "";
      list.forEach(function (c) {
        var btn = document.createElement("button");
        btn.className = "char";
        btn.textContent = c.name;
        btn.dataset.path = c.path;
        btn.addEventListener("click", function () {
          document.querySelectorAll(".char.active").forEach(function (x) { x.classList.remove("active"); });
          btn.classList.add("active");
          showCharacter(c.path);
        });
        box.appendChild(btn);
      });
      $("status").textContent = "共 " + list.length + " 个角色";
    })
    .catch(function (e) { showError("加载角色列表失败: " + e.message); });
}

var currentPath = null;

function renderIronNormal(td, span, btn) {
  td.innerHTML = "";
  td.appendChild(span);
  td.appendChild(btn);
}

function saveMoney(saveBtn, span, btn, td, valueStr) {
  var amount = parseInt(valueStr, 10);
  if (isNaN(amount) || amount < 0 || amount > 2147483647) {
    showError("请输入 0 ~ 2147483647 的整数");
    return;
  }
  saveBtn.disabled = true;
  fetch("/api/character/money", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: currentPath, amount: amount })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.ok) {
        span.textContent = String(data.iron);
        renderIronNormal(td, span, btn);
        showToast("已保存，金钱 = " + data.iron + "（备份: " + data.backup + "）");
      } else {
        saveBtn.disabled = false;
        showError("保存失败: " + (data.error || "未知错误"));
      }
    })
    .catch(function (e) {
      saveBtn.disabled = false;
      showError("保存失败: " + e.message);
    });
}

function buildIronCell(td, value) {
  var span = document.createElement("span");
  span.textContent = value;
  var btn = document.createElement("button");
  btn.className = "small-btn";
  btn.textContent = "修改";
  renderIronNormal(td, span, btn);
  btn.addEventListener("click", function () {
    td.innerHTML = "";
    var input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.max = "2147483647";
    input.step = "1";
    input.value = String(span.textContent);
    var saveBtn = document.createElement("button");
    saveBtn.className = "small-btn primary";
    saveBtn.textContent = "保存";
    var cancelBtn = document.createElement("button");
    cancelBtn.className = "small-btn";
    cancelBtn.textContent = "取消";
    td.appendChild(input);
    td.appendChild(saveBtn);
    td.appendChild(cancelBtn);
    cancelBtn.addEventListener("click", function () {
      renderIronNormal(td, span, btn);
    });
    saveBtn.addEventListener("click", function () {
      saveMoney(saveBtn, span, btn, td, input.value);
    });
    input.focus();
  });
}

function renderSkills(skills, container) {
  container.innerHTML = "";
  if (!skills || !skills.masteries) return;
  var h3 = document.createElement("h3");
  h3.textContent = "技能 / 专精";
  container.appendChild(h3);
  var pts = document.createElement("div");
  pts.className = "skills-points";
  pts.textContent = "可用技能点: " + (skills["skill-points"] || 0)
    + " · 属性点: " + (skills["attribute-points"] || 0)
    + " · 虔诚点: " + (skills["devotion-points"] || 0);
  container.appendChild(pts);

  function skillLine(sk) {
    var line = document.createElement("div");
    line.className = "sk";
    var tier = document.createElement("span");
    tier.className = "sk-tier";
    tier.textContent = sk.tier != null ? sk.tier : "–";
    line.appendChild(tier);
    var name = document.createElement("span");
    name.className = "sk-name";
    name.textContent = sk.name || sk.recordname || "?";
    name.title = sk.recordname || "";
    line.appendChild(name);
    var lv = document.createElement("span");
    lv.className = "sk-lv";
    lv.innerHTML = "Lv <b>" + sk.level + "</b>" + (sk["max-level"] != null ? " / Max " + sk["max-level"] : "");
    line.appendChild(lv);
    return line;
  }

  (skills.masteries || []).forEach(function (m) {
    var det = document.createElement("details");
    det.open = true;
    var sum = document.createElement("summary");
    sum.textContent = m.name || ("专精 " + m.classIndex);
    var inv = document.createElement("span");
    inv.className = "inv";
    inv.textContent = "已投入 " + m.invested + " 点";
    sum.appendChild(inv);
    det.appendChild(sum);
    var grid = document.createElement("div");
    grid.className = "sk-grid";
    (m.skills || []).forEach(function (sk) { grid.appendChild(skillLine(sk)); });
    det.appendChild(grid);
    container.appendChild(det);
  });

  if (skills.devotion && skills.devotion.length) {
    var detd = document.createElement("details");
    var sumd = document.createElement("summary");
    sumd.textContent = "虔诚技能";
    var invd = document.createElement("span");
    invd.className = "inv";
    invd.textContent = skills.devotion.length + " 项";
    sumd.appendChild(invd);
    detd.appendChild(sumd);
    var grid = document.createElement("div");
    grid.className = "sk-grid";
    skills.devotion.forEach(function (sk) { grid.appendChild(skillLine(sk)); });
    detd.appendChild(grid);
    container.appendChild(detd);
  }
}

function showCharacter(path) {
  currentPath = path;
  stashState.charPath = path;
  clearItemDetail();
  $("stash-view").style.display = "none";
  fetch("/api/character?path=" + encodeURIComponent(path) + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      $("char-name").textContent = data.name;
      var tbody = $("attr-table");
      tbody.innerHTML = "";
      (data.attributes || []).forEach(function (a) {
        var tr = document.createElement("tr");
        var tdL = document.createElement("td");
        tdL.textContent = a.label;
        tr.appendChild(tdL);
        var tdV = document.createElement("td");
        if (a.key === "iron") {
          buildIronCell(tdV, a.value);
        } else {
          tdV.textContent = a.value;
        }
        tr.appendChild(tdV);
        tbody.appendChild(tr);
      });
      $("detail-empty").style.display = "none";
      $("detail").style.display = "block";
      renderSkills(data.skills, $("skills-view"));
    })
    .catch(function (e) { showError("加载角色数据失败: " + e.message); });
}

/* ---------- 公共仓库 ---------- */
/* 稀有度配色与游戏一致：普通白、魔法绿、稀有黄、史诗蓝、传奇橙（对应 GD 文本色标 ^g/^y/^b/^o） */
var RARITY_COLORS = {
  "Broken": "#8a8f98", "Common": "#e6e8ec", "Magical": "#4ee064",
  "Rare": "#e6c14f", "Epic": "#4f9cf9", "Legendary": "#ff8c1a", "Quest": "#4fd6c9"
};
var RARITY_TEXT = {
  "Broken": "破损", "Common": "普通", "Magical": "魔法", "Rare": "稀有",
  "Epic": "史诗", "Legendary": "传奇", "Quest": "任务"
};
var RARITY_TEXT_EN = {
  "Broken": "Broken", "Common": "Common", "Magical": "Magical", "Rare": "Rare",
  "Epic": "Epic", "Legendary": "Legendary", "Quest": "Quest"
};

function getLang() {
  return localStorage.getItem("gdw.lang") === "en" ? "en" : "zh";
}

function langParam() { return "&lang=" + getLang(); }

function rarityText() { return getLang() === "en" ? RARITY_TEXT_EN : RARITY_TEXT; }

var stashState = { mode: "standard", pages: [], cur: 0, curPage: 0, catalogKind: "", selected: null,
                   source: "stash", charPath: null, charInv: null };

function pref(key, def) {
  var v = localStorage.getItem(key);
  return v === null ? def : v === "true";
}

function getCell() {
  var c = parseInt(localStorage.getItem("gdw.cell"), 10);
  return (isNaN(c) || c < 24 || c > 64) ? 38 : c;
}

function setCell(v) {
  v = Math.max(24, Math.min(64, v));
  localStorage.setItem("gdw.cell", String(v));
  $("cell-input").value = String(v);
  if (stashState.pages.length) loadStashPage(stashState.pages[stashState.cur]);
}

function bindPref(id, key) {
  $(id).checked = pref(key, true);
  $(id).addEventListener("change", function () {
    localStorage.setItem(key, $(id).checked ? "true" : "false");
    if (stashState.pages.length) loadStashPage(stashState.pages[stashState.cur]);
  });
}

function loadStash() {
  clearItemDetail();
  fetch("/api/stash?mode=" + stashState.mode + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      stashState.pages = (data.pages || []).map(function (p) { p.kind = "grid"; return p; });
      (data.extra || []).forEach(function (e) {
        stashState.pages.push({ kind: "catalog:" + e.kind, index: e.kind,
                                label: e.label, itemCount: e.itemCount });
      });
      $("stash-mode").style.display = data["has-hardcore"] ? "" : "none";
      renderStashTabs();
      if (!stashState.pages.length) {
        var g = $("stash-grid");
        g.innerHTML = '<div id="stash-empty">共享仓库为空</div>';
        $("status").textContent = "公共仓库 · 0 页";
        return;
      }
      stashState.cur = 0;
      loadStashPage(stashState.pages[0]);
    })
    .catch(function (e) { showError("加载公共仓库失败: " + e.message); });
}

function renderStashTabs() {
  var tabs = $("stash-tabs");
  tabs.innerHTML = "";
  stashState.pages.forEach(function (p, i) {
    var b = document.createElement("button");
    b.className = "tab-btn";
    b.textContent = p.label + " · " + p.itemCount;
    if (i === stashState.cur) b.classList.add("active");
    b.addEventListener("click", function () {
      stashState.cur = i;
      renderStashTabs();
      loadStashPage(p);
    });
    tabs.appendChild(b);
  });
}

function loadStashPage(page) {
  clearItemDetail();
  stashState.curPage = page.index;
  stashState.curPageKind = page.kind;
  if (page.kind === "char-sack") { loadCharSackPage(page); return; }
  if (page.kind === "equip" || page.kind === "weapon") { renderCharListPage(page); return; }
  if (page.kind && page.kind !== "grid") {
    loadCatalogPage(page);
    return;
  }
  fetch("/api/stash/page?mode=" + stashState.mode + "&index=" + page.index + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      $("status").textContent = "公共仓库 · " + stashState.pages.length + " 页";
      renderStashGrid(data, page.index);
    })
    .catch(function (e) { showError("加载页面失败: " + e.message); });
}

function loadCatalogPage(page) {
  clearItemDetail();
  var kind = page.kind.slice("catalog:".length);
  stashState.catalogKind = kind;
  fetch("/api/stash/extra?mode=" + stashState.mode + "&kind=" + encodeURIComponent(kind) + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      $("status").textContent = "公共仓库 · " + data.label + " · " + data.itemCount + " 件";
      renderCatalog(data);
    })
    .catch(function (e) { showError("加载 " + page.label + " 失败: " + e.message); });
}

/* ---------- 角色背包（背包袋 + 穿戴 + 武器组） ---------- */

function openCharInventory() {
  if (!stashState.charPath) { showError("请先选择角色"); return; }
  stashState.source = "char";
  $("detail").style.display = "none";
  $("detail-empty").style.display = "none";
  $("stash-view").style.display = "flex";
  $("stash-modes").style.display = "none";
  loadCharInventory();
}

function loadCharInventory() {
  clearItemDetail();
  fetch("/api/character/inventory?path=" + encodeURIComponent(stashState.charPath) + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      stashState.charInv = data;
      stashState.pages = [];
      (data.sacks || []).forEach(function (s) {
        if (s.unused && !s.itemCount) return;
        stashState.pages.push({ kind: "char-sack", index: s.index,
                                label: s.unused ? "背包 " + (s.index + 1) + "（未解锁）"
                                                : "背包 " + (s.index + 1),
                                itemCount: s.itemCount });
      });
      var equip = (data.equipment || []).filter(function (e) { return e.baseName; });
      if (equip.length) {
        stashState.pages.push({ kind: "equip", index: -1, label: "装备", itemCount: equip.length });
      }
      (data.weaponSets || []).forEach(function (ws) {
        var n = (ws.items || []).filter(function (e) { return e.baseName; }).length;
        if (n) stashState.pages.push({ kind: "weapon", set: ws.set, index: -1,
                                       label: "武器组 " + (ws.set + 1), itemCount: n });
      });
      if (!stashState.pages.length) {
        var g = $("stash-grid");
        g.innerHTML = '<div id="stash-empty">该角色背包为空</div>';
        $("status").textContent = "角色背包 · " + (data.name || stashState.charPath) + " · 0 项";
        return;
      }
      stashState.cur = 0;
      renderStashTabs();
      loadStashPage(stashState.pages[0]);
    })
    .catch(function (e) { showError("加载角色背包失败: " + e.message); });
}

function loadCharSackPage(page) {
  clearItemDetail();
  fetch("/api/character/inventory/page?path=" + encodeURIComponent(stashState.charPath)
        + "&sack=" + page.index + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      $("status").textContent = "角色背包 · " + (stashState.charInv ? stashState.charInv.name : "")
        + " · " + page.label + " · " + data.items.length + " 件 · 点击空白格可新增物品";
      renderStashGrid(data, page.index, "char-sack");
    })
    .catch(function (e) { showError("加载背包失败: " + e.message); });
}

function renderCharListPage(page) {
  clearItemDetail();
  stashState.catalogKind = null;
  var rows;
  if (page.kind === "equip") {
    rows = (stashState.charInv.equipment || []).map(function (e) {
      return { it: e, q: "source=equip&slot=" + e.slot, has: !!e.baseName };
    });
  } else {
    var ws = (stashState.charInv.weaponSets || [])[page.set] || { items: [] };
    rows = (ws.items || []).map(function (e, i) {
      return { it: e, q: "source=weapon&set=" + page.set + "&slot=" + i, has: !!e.baseName };
    });
  }
  renderCharList(rows, page.label);
}

function renderCharList(rows, label) {
  var grid = $("stash-grid");
  grid.style.width = "";
  grid.style.height = "";
  grid.style.backgroundColor = "rgba(255,255,255,0.035)";
  grid.innerHTML = "";
  $("status").textContent = "角色背包 · " + (stashState.charInv ? stashState.charInv.name : "")
    + " · " + label;
  var tbl = document.createElement("table");
  tbl.className = "catalog-list";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["槽位", "名称", "稀有度", "叠堆"].forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function (row) {
    var it = row.it;
    var tr = document.createElement("tr");
    var rarity = it.rarity;
    if (pref("gdw.showRarity", true) && rarity && RARITY_COLORS[rarity]) {
      tr.style.borderLeft = "3px solid " + RARITY_COLORS[rarity];
    }
    var cSlot = document.createElement("td");
    cSlot.textContent = it.label || "";
    tr.appendChild(cSlot);
    var cName = document.createElement("td");
    if (pref("gdw.showName", true) && it.name) cName.textContent = it.name;
    tr.appendChild(cName);
    var cRarity = document.createElement("td");
    var rt = rarityText()[rarity] || rarity || "";
    if (pref("gdw.showRarityText", true) && rt) {
      cRarity.textContent = rt;
      if (RARITY_COLORS[rarity]) cRarity.style.color = RARITY_COLORS[rarity];
    }
    tr.appendChild(cRarity);
    var cCount = document.createElement("td");
    cCount.textContent = it.stackCount > 1 ? "×" + it.stackCount : "";
    tr.appendChild(cCount);
    if (row.has) {
      tr.title = [it.label, it.name, "稀有度: " + (rarityText()[rarity] || rarity)].join(" | ");
      tr._item = it;
      tr._el = tr;
      tr.addEventListener("click", function () { selectItem(it, row.q); });
    } else {
      tr.style.opacity = "0.45";
      tr.title = it.label + "（空）";
    }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  grid.appendChild(tbl);
}

function renderCatalog(data) {
  var grid = $("stash-grid");
  grid.style.width = "";
  grid.style.height = "";
  grid.style.backgroundColor = "rgba(255,255,255,0.035)";
  grid.innerHTML = "";
  var tbl = document.createElement("table");
  tbl.className = "catalog-list";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["名称", "稀有度", "数量", "路径"].forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);
  var tbody = document.createElement("tbody");
  (data.items || []).forEach(function (it) {
    var tr = document.createElement("tr");
    var rarity = it.rarity;
    if (pref("gdw.showRarity", true) && rarity && RARITY_COLORS[rarity]) {
      tr.style.borderLeft = "3px solid " + RARITY_COLORS[rarity];
    }
    var cName = document.createElement("td");
    if (pref("gdw.showName", true) && it.name) cName.textContent = it.name;
    var cRarity = document.createElement("td");
    var rt = rarityText()[rarity] || rarity || "";
    if (pref("gdw.showRarityText", true) && rt) {
      cRarity.textContent = rt;
      if (RARITY_COLORS[rarity]) cRarity.style.color = RARITY_COLORS[rarity];
    }
    var cCount = document.createElement("td");
    cCount.className = "cat-count";
    cCount.textContent = "×" + (it.count || 1);
    var cPath = document.createElement("td");
    cPath.className = "cat-path";
    cPath.textContent = it.baseName || "";
    tr.appendChild(cName);
    tr.appendChild(cRarity);
    tr.appendChild(cCount);
    tr.appendChild(cPath);
    if (pref("gdw.showName", true) && it.name) {
      tr.title = [it.name, "稀有度: " + (rarityText()[rarity] || rarity),
                  "数量: " + (it.count || 1), it.baseName].join(" | ");
    }
    tr._item = it;
    tr._el = tr;
    tr.addEventListener("click", function () {
      selectItem(it, "kind=" + encodeURIComponent(stashState.catalogKind) +
                     "&path=" + encodeURIComponent(it.baseName));
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  grid.appendChild(tbl);
}

function renderStashGrid(data, index, kind) {
  var grid = $("stash-grid");
  var CELL = getCell();
  grid.style.setProperty("--cell", CELL + "px");
  grid.style.width = (data.width * CELL) + "px";
  grid.style.height = (data.height * CELL) + "px";
  grid.style.backgroundColor = pref("gdw.showEmpty", true)
    ? "rgba(255,255,255,0.035)" : "transparent";
  grid.innerHTML = "";
  (data.items || []).forEach(function (it) {
    var w = (it.w && it.w > 0) ? it.w : 1;
    var h = (it.h && it.h > 0) ? it.h : 1;
    var div = document.createElement("div");
    div.className = "stash-item";
    div.style.left = (it.x * CELL) + "px";
    div.style.top = (it.y * CELL) + "px";
    div.style.width = (w * CELL) + "px";
    div.style.height = (h * CELL) + "px";
    var rarity = it.rarity;
    if (pref("gdw.showRarity", true) && rarity && RARITY_COLORS[rarity]) {
      div.style.borderColor = RARITY_COLORS[rarity];
    }
    var nm = it.name || it.baseName || "?";
    if (pref("gdw.showRarityText", true) && rarity && rarityText()[rarity]) {
      var rt = document.createElement("span");
      rt.className = "st-rarity";
      rt.textContent = rarityText()[rarity];
      div.appendChild(rt);
    }
    if (it.level) {
      var lv = document.createElement("span");
      lv.className = "st-level";
      lv.textContent = "Lv" + it.level;
      div.appendChild(lv);
    }
    if (pref("gdw.showName", true) && it.name) {
      var sn = document.createElement("span");
      sn.className = "st-name";
      sn.textContent = it.name;
      div.appendChild(sn);
    }
    if (pref("gdw.showStack", true) && it.stackCount > 1) {
      var sc = document.createElement("span");
      sc.className = "st-count";
      sc.textContent = "×" + it.stackCount;
      div.appendChild(sc);
    }
    var tip = [nm];
    if (it.level) tip.push("等级: " + it.level);
    if (it.prefixName) tip.push("前缀: " + it.prefixName);
    if (it.suffixName) tip.push("后缀: " + it.suffixName);
    if (rarity) tip.push("稀有度: " + (rarityText()[rarity] || rarity));
    tip.push("坐标 (" + it.x + "," + it.y + ")");
    tip.push("占地 " + (w === 1 && h === 1 ? "1×1" : w + "×" + h));
    if (it.stackCount > 1) tip.push("叠堆 " + it.stackCount);
    div.title = tip.join(" | ");
    div._item = it;
    div._el = div;
    grid.appendChild(div);
  });
  stashState.pageDims = { width: data.width, height: data.height };
  stashState.curPageKind = kind || "grid";
}

/* ---------- 新增物品选择器 ---------- */
var pickerState = {
  sack: null, x: null, y: null,
  q: "", offset: 0, pageSize: 50, total: 0, selected: null
};

function buildOccupancy() {
  var occ = {};
  document.querySelectorAll("#stash-grid .stash-item").forEach(function (div) {
    var it = div._item;
    if (!it) return;
    var w = (it.w && it.w > 0) ? it.w : 1;
    var h = (it.h && it.h > 0) ? it.h : 1;
    for (var dx = 0; dx < w; dx++) {
      for (var dy = 0; dy < h; dy++) {
        occ[(it.x + dx) + "," + (it.y + dy)] = true;
      }
    }
  });
  return occ;
}

function openPicker(sack, x, y) {
  pickerState.sack = sack;
  pickerState.x = x; pickerState.y = y;
  pickerState.q = ""; pickerState.offset = 0; pickerState.selected = null;
  $("picker-pos").textContent = "背包 " + (sack + 1) + " → (" + x + "," + y + ")";
  $("picker-q").value = "";
  $("picker-count").value = "1";
  $("picker-overlay").style.display = "flex";
  loadItems();
}

function closePicker() {
  $("picker-overlay").style.display = "none";
}

function loadItems() {
  var url = "/api/items?offset=" + pickerState.offset + "&limit=" + pickerState.pageSize + langParam()
    + (pickerState.q ? "&q=" + encodeURIComponent(pickerState.q) : "");
  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      pickerState.total = data.total || 0;
      renderItems(data.items || []);
    })
    .catch(function (e) { showError("加载物品列表失败: " + e.message); });
}

function renderItems(items) {
  var list = $("picker-list");
  list.innerHTML = "";
  if (!items.length) {
    var empty = document.createElement("div");
    empty.style.cssText = "color:var(--muted);padding:24px;text-align:center";
    empty.textContent = "没有匹配的物品";
    list.appendChild(empty);
  }
  items.forEach(function (it) {
    var row = document.createElement("div");
    row.className = "picker-row";
    var dimsOk = it.w && it.h && it.w > 0 && it.h > 0;
    if (!dimsOk) {
      row.classList.add("disabled");
    } else if (pickerState.selected && pickerState.selected._base === it.baseName) {
      row.classList.add("selected");
    }
    var cName = document.createElement("span");
    cName.className = "pk-name";
    cName.textContent = it.name || it.baseName;
    row.appendChild(cName);
    var cRarity = document.createElement("span");
    cRarity.className = "pk-rarity";
    var rt = rarityText()[it.rarity] || it.rarity || "";
    if (rt) {
      cRarity.textContent = rt;
      if (RARITY_COLORS[it.rarity]) cRarity.style.color = RARITY_COLORS[it.rarity];
    }
    row.appendChild(cRarity);
    if (it.level) {
      var cLevel = document.createElement("span");
      cLevel.className = "pk-level";
      cLevel.textContent = "Lv" + it.level;
      row.appendChild(cLevel);
    }
    var cDims = document.createElement("span");
    cDims.className = "pk-dims";
    cDims.textContent = dimsOk ? (it.w + "×" + it.h) : "无法占格";
    row.appendChild(cDims);
    row.title = it.baseName + (pickerState.x !== null
      ? "\n新增位置: (" + pickerState.x + "," + pickerState.y + ")" : "");
    if (dimsOk) {
      row.addEventListener("click", function () {
        pickerState.selected = { _base: it.baseName };
        document.querySelectorAll(".picker-row.selected").forEach(function (x) { x.classList.remove("selected"); });
        row.classList.add("selected");
      });
    }
    list.appendChild(row);
  });
  var pageCnt = Math.max(1, Math.ceil(pickerState.total / pickerState.pageSize));
  var pageNo = pickerState.total === 0 ? 0 : Math.floor(pickerState.offset / pickerState.pageSize) + 1;
  $("picker-page").textContent = pageNo + " / " + pageCnt;
  $("picker-total").textContent = "共 " + pickerState.total + " 件";
  $("picker-prev").disabled = pickerState.offset <= 0;
  $("picker-next").disabled = pickerState.offset + pickerState.pageSize >= pickerState.total;
}

function submitAdd() {
  if (!pickerState.selected) { showError("请先选择要新增的物品"); return; }
  var count = parseInt($("picker-count").value, 10);
  if (isNaN(count) || count < 1 || count > 9999) { showError("数量必须是 1 ~ 9999 的整数"); return; }
  var btn = $("picker-add");
  btn.disabled = true;
  fetch("/api/character/inventory/item", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      path: stashState.charPath, sack: pickerState.sack,
      x: pickerState.x, y: pickerState.y,
      basename: pickerState.selected._base, count: count
    })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      btn.disabled = false;
      if (data.ok) {
        closePicker();
        showToast("已新增 ×" + count + "（备份: " + data.backup + "）");
        loadStashPage(stashState.pages[stashState.cur]);
      } else {
        showError(data.error || "新增失败");
      }
    })
    .catch(function (e) { btn.disabled = false; showError("新增失败: " + e.message); });
}

$("stash-btn").addEventListener("click", function () {

  this.classList.add("active");

  stashState.charInv = null;

$("inv-btn").addEventListener("click", function () {
  openCharInventory();
});

$("stash-grid-wrap").addEventListener("click", function (e) {
  var hit = e.target && e.target.closest ? e.target.closest(".stash-item") : null;
  if (hit && hit._item) {
    var q = stashState.source === "char"
      ? "source=sack&sack=" + stashState.curPage + "&slot=" + hit._item.slot
      : "page=" + stashState.curPage + "&slot=" + hit._item.slot;
    selectItem(hit._item, q);
  } else if (stashState.source === "char" && stashState.curPageKind === "char-sack" && stashState.pageDims) {
    var CELL = getCell();
    var rect = $("stash-grid").getBoundingClientRect();
    var gx = Math.floor((e.clientX - rect.left) / CELL);
    var gy = Math.floor((e.clientY - rect.top) / CELL);
    if (gx >= 0 && gy >= 0 && gx < stashState.pageDims.width && gy < stashState.pageDims.height) {
      var occ = buildOccupancy();
      if (occ.hasOwnProperty(gx + "," + gy)) {
        clearItemDetail();
      } else {
        clearItemDetail();
        openPicker(stashState.curPage, gx, gy);
      }
    } else {
      clearItemDetail();
    }
  } else {
    clearItemDetail();
  }
});

$("stash-mode").addEventListener("change", function () {
  stashState.mode = this.value;
  stashState.cur = 0;
  loadStash();
});

function selectItem(it, q) {
  clearItemDetail();
  stashState.selected = { q: q, it: it };
  if (it._el) it._el.classList.add("selected");
  loadItemDetail();
}

function deleteSackItem(sel) {
  var it = sel.it;
  var label = it.name || it.baseName || "该物品";
  if (!confirm("确定要从背包袋中删除“" + label + "”吗？\n删除前会自动备份，可通过备份恢复。")) return;
  fetch("/api/character/inventory/item/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: stashState.charPath, sack: stashState.curPage, slot: it.slot })
  })
    .then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    })
    .then(function (res) {
      if (res.ok && res.d.ok) {
        showToast("已删除（备份: " + res.d.backup + "）");
        clearItemDetail();
        loadStashPage(stashState.pages[stashState.cur]);
      } else {
        showError((res.d && res.d.error) || "删除失败");
      }
    })
    .catch(function (e) { showError("删除失败: " + e.message); });
}

function setSackItemCount(sel, val) {
  var n = parseInt(val, 10);
  if (!(n >= 1 && n <= 9999)) { showError("数量必须是 1~9999 的整数"); return; }
  var it = sel.it;
  var label = it.name || it.baseName || "该物品";
  if (!confirm("确定要把“" + label + "”的叠堆数量改为 " + n + " 吗？\n修改前会自动备份，可通过备份恢复。")) return;
  fetch("/api/character/inventory/item/count", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: stashState.charPath, q: sel.q, count: n })
  })
    .then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    })
    .then(function (res) {
      if (res.ok && res.d.ok) {
        showToast("已修改数量为 " + res.d.stackCount + "（备份: " + res.d.backup + "）");
        clearItemDetail();
        loadStashPage(stashState.pages[stashState.cur]);
      } else {
        showError((res.d && res.d.error) || "修改数量失败");
      }
    })
    .catch(function (e) { showError("修改数量失败: " + e.message); });
}

function clearItemDetail() {
  stashState.selected = null;
  document.querySelectorAll(".stash-item.selected, .catalog-list tr.selected")
    .forEach(function (x) { x.classList.remove("selected"); });
  var d = $("item-detail");
  d.classList.remove("open");
  d.innerHTML = "";
}

function loadItemDetail() {
  var sel = stashState.selected;
  if (!sel) return;
  var d = $("item-detail");
  d.classList.add("open");
  d.innerHTML = "";
  var head = document.createElement("div");
  head.id = "item-detail-head";
  var headMain = document.createElement("div");
  headMain.style.cssText = "flex:1;min-width:0";
  var name = document.createElement("div");
  name.id = "item-detail-name";
  name.textContent = "...";
  var sub = document.createElement("div");
  sub.id = "item-detail-sub";
  sub.textContent = "加载中...";
  headMain.appendChild(name);
  headMain.appendChild(sub);
  head.appendChild(headMain);
  var lines = document.createElement("div");
  lines.id = "idetail-lines";
  d.appendChild(head);
  d.appendChild(lines);
  fetch((stashState.source === "char"
         ? "/api/character/inventory/item?path=" + encodeURIComponent(stashState.charPath) + "&"
         : "/api/stash/item?mode=" + stashState.mode + "&") + sel.q + langParam())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      if (stashState.selected !== sel) return;
      affixState.detailData = data;
      name.textContent = data.name || "";
      if (data.rarity && RARITY_COLORS[data.rarity]) name.style.color = RARITY_COLORS[data.rarity];
      var parts = [];
      if (data.rarity) parts.push(rarityText()[data.rarity] || data.rarity);
      if (data.stackCount > 1) parts.push("叠堆 x" + data.stackCount);
      if (data.w && data.h) {
        parts.push("占地 " + (data.w === 1 && data.h === 1 ? "1x1" : data.w + "x" + data.h));
      }
      if (typeof sel.it.x === "number" && typeof sel.it.y === "number") {
        parts.push("(" + sel.it.x + "," + sel.it.y + ")");
      }
      sub.textContent = parts.join(" - ");
      var detailLines = (data.lines || []).slice();
      var lvLines = [];
      if (data.prefixLevel) lvLines.push([[[ "前缀 等级: " + data.prefixLevel, "" ]]]);
      if (data.suffixLevel) lvLines.push([[[ "后缀 等级: " + data.suffixLevel, "" ]]]);
      renderItemDetailLines(lines, lvLines.concat(detailLines));
      if (stashState.source === "char" && sel.q.indexOf("source=sack") === 0) {
        var del = document.createElement("button");
        del.className = "small-btn danger";
        del.textContent = "删除";
        del.title = "从背包袋中移除该物品（写入前自动备份）";
        del.addEventListener("click", function () { deleteSackItem(sel); });
        head.appendChild(del);
        if (data.stackCount > 1) {
          var qtyWrap = document.createElement("div");
          qtyWrap.className = "qty-editor";
          var qtyIn = document.createElement("input");
          qtyIn.type = "number";
          qtyIn.min = 1;
          qtyIn.max = 9999;
          qtyIn.value = data.stackCount;
          qtyIn.title = "新的叠堆数量";
          var qtyBtn = document.createElement("button");
          qtyBtn.className = "small-btn";
          qtyBtn.textContent = "改数量";
          qtyBtn.title = "修改该材料的叠堆数量（写入前自动备份）";
          qtyBtn.addEventListener("click", function () { setSackItemCount(sel, qtyIn.value); });
          qtyWrap.appendChild(qtyIn);
          qtyWrap.appendChild(qtyBtn);
          head.appendChild(qtyWrap);
        }
      }
      if (stashState.source === "char") {
        var va = data.validAffixes || {};
        [["prefix", "改前缀"], ["suffix", "改后缀"]].forEach(function (pair) {
          if ((va[pair[0]] || []).length) {
            var ab = document.createElement("button");
            ab.className = "small-btn";
            ab.textContent = pair[1];
            ab.title = "修改该装备的" + (pair[0] === "prefix" ? "前缀" : "后缀") + "（写入前自动备份）";
            (function (bb, kk) { bb.addEventListener("click", function () { openAffixPicker(kk); }); })(ab, pair[0]);
            head.appendChild(ab);
          }
        });
      }
    })
    .catch(function (e) {
      if (stashState.selected !== sel) return;
      sub.textContent = "加载失败";
      showError("加载物品详情失败: " + e.message);
    });
}

function renderItemDetailLines(el, lines) {
  el.innerHTML = "";
  (lines || []).forEach(function (runs) {
    var line = document.createElement("div");
    line.className = "line";
    if (!runs || !runs.length) {
      line.classList.add("empty");
      el.appendChild(line);
      return;
    }
    runs.forEach(function (run) {
      var sp = document.createElement("span");
      if (run[1]) sp.className = run[1];
      sp.textContent = run[0];
      line.appendChild(sp);
    });
    el.appendChild(line);
  });
}

/* ---------- 修改装备前后缀 ---------- */
var affixState = { kind: null, q: null, list: [], curPath: "", sel: undefined, detailData: null };

function openAffixPicker(kind) {
  var sel = stashState.selected;
  if (!sel || !affixState.detailData) return;
  var va = affixState.detailData.validAffixes || {};
  var arr = va[kind] || [];
  if (!arr.length) return;
  affixState.kind = kind;
  affixState.q = sel.q;
  affixState.list = arr;
  affixState.curPath = (kind === "prefix"
                        ? (affixState.detailData.prefixPath || "")
                        : (affixState.detailData.suffixPath || ""));
  affixState.sel = undefined;
  $("affix-q").value = "";
  $("affix-sub").textContent = (kind === "prefix" ? "前缀" : "后缀") + " · 当前: " +
    (affixState.curPath ? (affixState.curPath.split("/").pop() || affixState.curPath) : "无");
  $("affix-title").textContent = "修改" + (kind === "prefix" ? "前缀" : "后缀") +
    " · " + (affixState.detailData.name || "");
  $("affix-overlay").style.display = "flex";
  renderAffixList();
}

function closeAffixPicker() { $("affix-overlay").style.display = "none"; affixState.sel = undefined; }

function renderAffixList() {
  var listEl = $("affix-list");
  listEl.innerHTML = "";
  if (!affixState.list.length) {
    var empty = document.createElement("div");
    empty.className = "bk-empty";
    empty.textContent = "该装备没有可选的" + (affixState.kind === "prefix" ? "前缀" : "后缀");
    listEl.appendChild(empty);
    return;
  }
  var q = ($("affix-q").value || "").trim().toLowerCase();
  var filtered = affixState.list.filter(function (a) {
    if (!q) return true;
    return (a.name || "").toLowerCase().indexOf(q) !== -1
      || (a.path || "").toLowerCase().indexOf(q) !== -1;
  });
  var rows = [{ path: "", name: "（无）清除词缀", level: null, lines: null, cur: affixState.curPath === "" }];
  filtered.forEach(function (a) {
    rows.push({ path: a.path, name: a.name, level: a.level, lines: a.lines, cur: a.path === affixState.curPath });
  });
  $("affix-total").textContent = rows.length + " 项";
  rows.forEach(function (r) {
    var row = document.createElement("div");
    row.className = "picker-row";
    if (affixState.sel === r.path) row.classList.add("selected");
    var nm = document.createElement("span");
    nm.className = "pk-name";
    nm.textContent = r.name;
    nm.title = r.path || "清除词缀";
    row.appendChild(nm);
    if (r.cur) {
      var badge = document.createElement("span");
      badge.className = "ax-cur";
      badge.textContent = "当前";
      row.appendChild(badge);
    }
    if (r.level) {
      var lv = document.createElement("span");
      lv.className = "ax-level";
      lv.textContent = "Lv" + r.level;
      row.appendChild(lv);
    }
    if (r.lines && r.lines.length) {
      var attrs = document.createElement("div");
      attrs.className = "ax-attrs";
      r.lines.forEach(function (runs) {
        var line = document.createElement("div");
        line.className = "line";
        line.textContent = (runs || []).map(function (seg) { return seg[0]; }).join("");
        attrs.appendChild(line);
      });
      row.appendChild(attrs);
    }
    row.addEventListener("click", function () {
      affixState.sel = r.path;
      listEl.querySelectorAll(".picker-row.selected").forEach(function (x) { x.classList.remove("selected"); });
      row.classList.add("selected");
    });
    listEl.appendChild(row);
  });
}

function applyAffix() {
  if (affixState.sel === undefined) { showError("请先选择一个词缀（或「清除词缀」）"); return; }
  if (!affixState.q) { showError("缺少物品定位信息"); return; }
  var btn = $("affix-apply");
  btn.disabled = true;
  fetch("/api/character/inventory/item/affix", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: stashState.charPath, q: affixState.q,
                           kind: affixState.kind, affixPath: affixState.sel || "" })
  })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      btn.disabled = false;
      if (res.ok && res.d.ok) {
        showToast("词缀已修改（备份: " + res.d.backup + "）");
        closeAffixPicker();
        loadStashPage(stashState.pages[stashState.cur]);
      } else {
        showError((res.d && res.d.error) || "修改词缀失败");
      }
    })
    .catch(function (e) { btn.disabled = false; showError("修改词缀失败: " + e.message); });
}

/* ---------- 备份管理 ---------- */
var backupState = { files: [] };

function openBackupManager() {
  if (!stashState.charPath) { showError("请先选择角色"); return; }
  var pc = stashState.charPath.split(/[\\/]/);
  $("backup-sub").textContent = pc.slice(-2).join("/") + " 目录下的 .bak 备份";
  $("backup-overlay").style.display = "flex";
  loadBackups();
}

function closeBackupManager() { $("backup-overlay").style.display = "none"; }

function loadBackups() {
  var url = "/api/character/backups?path=" + encodeURIComponent(stashState.charPath);
  fetch(url)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) { backupState.files = data.backups || []; renderBackups(); })
    .catch(function (e) { showError("加载备份列表失败: " + e.message); });
}

function fmtSize(b) {
  if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  if (b >= 1024) return (b / 1024).toFixed(0) + " KB";
  return b + " B";
}

function bkSelectedNames() {
  var names = [];
  document.querySelectorAll("#backup-list input[type=checkbox]:checked").forEach(function (c) {
    names.push(c.dataset.file);
  });
  return names;
}

function updateBkDeleteBtn() {
  var n = bkSelectedNames().length;
  var btn = $("backup-delete");
  btn.textContent = "删除选中 (" + n + ")";
  btn.disabled = n === 0;
}

function renderBackups() {
  var list = $("backup-list");
  list.innerHTML = "";
  if (!backupState.files.length) {
    var e = document.createElement("div");
    e.className = "bk-empty";
    e.textContent = "暂无备份";
    list.appendChild(e);
    $("backup-delete").disabled = true;
    $("backup-delete").textContent = "删除选中 (0)";
    return;
  }
  backupState.files.forEach(function (bk) {
    var row = document.createElement("div");
    row.className = "bk-row";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.dataset.file = bk.file;
    cb.addEventListener("change", updateBkDeleteBtn);
    row.appendChild(cb);
    var fName = document.createElement("span");
    fName.className = "bk-file";
    fName.textContent = bk.file;
    fName.title = bk.file;
    row.appendChild(fName);
    var sName = document.createElement("span");
    sName.className = "bk-size";
    sName.textContent = fmtSize(bk.size);
    row.appendChild(sName);
    var tName = document.createElement("span");
    tName.className = "bk-time";
    tName.textContent = new Date(bk.mtime).toLocaleString();
    row.appendChild(tName);
    list.appendChild(row);
  });
  updateBkDeleteBtn();
}

function deleteBackups() {
  var names = bkSelectedNames();
  if (!names.length) return;
  if (!confirm("确定删除选中的 " + names.length + " 个备份？\n删除后不可恢复。\n\n" +
               names.slice(0, 8).join("\n") + (names.length > 8 ? "\n…" : ""))) return;
  fetch("/api/character/backups/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: stashState.charPath, files: names })
  })
    .then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    })
    .then(function (res) {
      if (!res.ok) { showError((res.d && res.d.error) || "删除失败"); return; }
      var d = res.d;
      if (d.failed && d.failed.length) {
        showError("部分删除失败: " + d.failed.join(", "));
      } else {
        showToast("已删除 " + d.deleted.length + " 个备份");
      }
      loadBackups();
    })
    .catch(function (e) { showError("删除失败: " + e.message); });
}

$("backup-btn").addEventListener("click", openBackupManager);
$("backup-close").addEventListener("click", closeBackupManager);
$("backup-overlay").addEventListener("click", function (e) {
  if (e.target === $("backup-overlay")) closeBackupManager();
});
$("backup-selectall").addEventListener("click", function () {
  var cbs = document.querySelectorAll("#backup-list input[type=checkbox]");
  var allOn = cbs.length > 0 && Array.prototype.every.call(cbs, function (c) { return c.checked; });
  cbs.forEach(function (c) { c.checked = !allOn; });
  updateBkDeleteBtn();
});
$("backup-delete").addEventListener("click", deleteBackups);

$("affix-close").addEventListener("click", closeAffixPicker);
$("affix-overlay").addEventListener("click", function (e) {
  if (e.target === $("affix-overlay")) closeAffixPicker();
});
$("affix-q").addEventListener("input", renderAffixList);
$("affix-apply").addEventListener("click", applyAffix);

loadCharacters();
</script>
</body>
</html>
